[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Third-party deprecation notices (PyMuPDF SWIG bindings, Starlette test client).
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
